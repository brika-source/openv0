<style>
:root{
  --bg:#eceff2; --panel:#ffffff; --panel-2:#f6f8fa; --ink:#10171c; --muted:#596a75;
  --line:#ccd7de; --line-soft:#e2e9ee;
  --accent:#005f73; --accent-ink:#ffffff; --accent-soft:#dbecf0;
  --ok:#136c43; --ok-soft:#ddefe6; --info:#1b5aa0; --info-soft:#dce8f6;
  --warn:#96590a; --warn-soft:#f8ead3; --bad:#9e1d13; --bad-soft:#f8dedc;
  --neutral:#596a75; --neutral-soft:#e3eaee;
  --shadow:0 1px 2px rgba(16,23,28,.05), 0 10px 26px -20px rgba(16,23,28,.5);
  --rail:236px;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1115; --panel:#141d23; --panel-2:#101920; --ink:#e6eef2; --muted:#8ba0ab;
    --line:#26343d; --line-soft:#1c272e;
    --accent:#3aa8c4; --accent-ink:#04161c; --accent-soft:#113039;
    --ok:#4ec08a; --ok-soft:#0f2c1f; --info:#6da9ee; --info-soft:#12253a;
    --warn:#dda23f; --warn-soft:#32250f; --bad:#f0736a; --bad-soft:#341a19;
    --neutral:#8ba0ab; --neutral-soft:#1d272e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1115; --panel:#141d23; --panel-2:#101920; --ink:#e6eef2; --muted:#8ba0ab;
  --line:#26343d; --line-soft:#1c272e;
  --accent:#3aa8c4; --accent-ink:#04161c; --accent-soft:#113039;
  --ok:#4ec08a; --ok-soft:#0f2c1f; --info:#6da9ee; --info-soft:#12253a;
  --warn:#dda23f; --warn-soft:#32250f; --bad:#f0736a; --bad-soft:#341a19;
  --neutral:#8ba0ab; --neutral-soft:#1d272e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:15px}
h3{font-size:13px}
p{margin:0 0 10px}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- shell ------------------------------------------------------------- */
.shell{display:flex; flex-direction:column; min-height:100%}
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-.01em}
.brand .dot{width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.brand small{display:block; font-size:10.5px; color:var(--muted); font-weight:500; letter-spacing:.08em; text-transform:uppercase}
.topbar .spacer{flex:1 1 auto}
.who{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
.who select{max-width:190px}

.body{display:flex; align-items:flex-start; flex:1 1 auto}
.rail{
  flex:0 0 var(--rail); width:var(--rail); align-self:stretch;
  padding:14px 10px; border-right:1px solid var(--line); background:var(--panel-2);
}
.rail .group{margin-bottom:16px}
.rail .group-label{font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); padding:0 10px 6px; font-weight:600}
.rail button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 10px; margin-bottom:2px; border:0; border-radius:6px;
  background:transparent; color:var(--ink); cursor:pointer; font-size:13.5px;
}
.rail button:hover{background:var(--line-soft)}
.rail button[aria-current="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.rail button .tally{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.rail button[aria-current="true"] .tally{color:var(--accent-ink); opacity:.85}
.rail .glyph{width:16px; text-align:center; opacity:.85}

main{flex:1 1 auto; min-width:0; padding:18px 16px 56px; max-width:1520px}

@media (max-width:900px){
  /* Stretch the children to the viewport, or the rail's scrolling row of buttons
     sets the page width and the whole page scrolls sideways. */
  .body{flex-direction:column; align-items:stretch}
  .rail{
    flex:none; width:100%; max-width:100%; min-width:0; align-self:auto;
    display:flex; gap:6px; overflow-x:auto; padding:8px 12px;
    border-right:0; border-bottom:1px solid var(--line);
  }
  main{width:100%; max-width:100%; min-width:0}
  .rail .group{display:flex; gap:6px; margin:0; flex:0 0 auto}
  .rail .group-label{display:none}
  .rail button{width:auto; white-space:nowrap; padding:7px 11px}
  .rail button .tally{margin-left:6px}
}

/* ---- primitives -------------------------------------------------------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow)}
.panel-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 14px; border-bottom:1px solid var(--line-soft)}
.panel-head h2{flex:1 1 auto}
.panel-body{padding:14px}
.hint{font-size:12px; color:var(--muted)}
.row{display:flex; gap:14px; flex-wrap:wrap}
.row > *{min-width:0}
.col{flex:1 1 270px}
.col-wide{flex:2 1 420px}
.stack{display:flex; flex-direction:column; gap:14px}
.page-head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.page-head .lead{flex:1 1 320px}
.page-head .hint{margin-top:2px}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.dim{color:var(--muted)}
.nowrap{white-space:nowrap}

.readouts{display:flex; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden}
.readout{flex:1 1 150px; padding:12px 16px; border-left:1px solid var(--line-soft)}
.readout:first-child{border-left:0}
.readout .k{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600}
.readout .v{font-family:var(--mono); font-size:26px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums}
.readout .v small{font-size:13px; font-weight:500; color:var(--muted)}
.readout .s{font-size:11.5px; color:var(--muted)}
.readout.alert .v{color:var(--bad)}
.readout.good .v{color:var(--ok)}

.pill{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; border:1px solid transparent}
.pill.ok{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
.pill.info{background:var(--info-soft); color:var(--info); border-color:var(--info)}
.pill.warn{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad); border-color:var(--bad)}
.pill.neutral{background:var(--neutral-soft); color:var(--neutral); border-color:var(--line)}
.pill.accent{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}

.handle{font-family:var(--mono); font-size:11.5px; padding:1px 5px; border-radius:4px; background:var(--accent-soft); color:var(--accent); border:1px solid var(--line-soft); white-space:nowrap}
a.handle:hover{text-decoration:none; filter:brightness(.96)}
.handle + .handle{margin-left:3px}
.handle.plain{background:var(--neutral-soft); color:var(--muted)}

.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-size:13px; font-weight:500}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px; font-size:12px}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn:disabled{opacity:.5; cursor:not-allowed}

label.field{display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:8px}
label.field > span{display:block; margin-bottom:3px; letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel); color:var(--ink); font-size:13px; font-weight:400;
}
select[multiple]{padding:4px}
textarea{resize:vertical; min-height:60px; line-height:1.5}
.check{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); font-weight:500}
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.filters label.field{margin:0; min-width:132px; flex:0 1 auto}
.filters .grow{flex:1 1 220px}
.chips{display:flex; gap:6px; flex-wrap:wrap}

.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse}
thead th{
  position:sticky; top:0; z-index:1; background:var(--panel);
  text-align:left; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:600; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
tbody tr.clickable{cursor:pointer}
td.stripe{border-left:3px solid var(--line)}
td.stripe.ok{border-left-color:var(--ok)}
td.stripe.info{border-left-color:var(--info)}
td.stripe.warn{border-left-color:var(--warn)}
td.stripe.bad{border-left-color:var(--bad)}
td.stripe.neutral{border-left-color:var(--neutral)}
.empty{padding:22px; text-align:center; color:var(--muted); font-size:13px}
.serial{font-family:var(--mono); font-size:12px; white-space:nowrap}

.bar{height:7px; border-radius:4px; background:var(--line-soft); overflow:hidden; min-width:60px}
.bar > i{display:block; height:100%; background:var(--ok); border-radius:4px}
.bar.accent > i{background:var(--accent)}
.meter{display:flex; align-items:center; gap:8px}
.meter .bar{flex:1 1 auto}
.meter .pct{font-family:var(--mono); font-size:11.5px; color:var(--muted); width:44px; text-align:right}

.grid-wrap{overflow-x:auto}
table.weeks{min-width:960px}
table.weeks th.wk{text-align:center; padding:6px 2px; min-width:42px}
table.weeks th.wk b{display:block; font-family:var(--mono); font-size:11px; color:var(--ink); letter-spacing:0}
table.weeks th.wk.now{background:var(--accent-soft); color:var(--accent)}
table.weeks td.cell{padding:0; text-align:center; border-left:1px solid var(--line-soft)}
.cellbtn{width:100%; min-width:40px; padding:6px 0; border:0; background:transparent; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--line)}
.cellbtn:hover{background:var(--accent-soft)}
.cellbtn.T{background:var(--info); color:#fff}
.cellbtn.R{background:var(--warn); color:#fff}
.cellbtn.A{background:var(--ok); color:#fff}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px}
.legend b{font-family:var(--mono)}

.scrim{position:fixed; inset:0; background:rgba(8,14,18,.45); z-index:40; border:0}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(560px, 100%); z-index:41;
  background:var(--panel); border-left:1px solid var(--line); overflow-y:auto;
  padding:16px 18px calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow:-20px 0 40px -30px rgba(0,0,0,.6);
}
.drawer header{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px}
.drawer header h2{flex:1 1 auto; font-size:16px}
.kv{display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:12.5px; margin:0 0 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; overflow-wrap:anywhere}
.note{white-space:pre-wrap; font-size:12.5px; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:6px; padding:8px 10px}
.log{list-style:none; margin:0; padding:0; font-size:12.5px}
.log li{padding:7px 0; border-top:1px solid var(--line-soft)}
.log li:first-child{border-top:0}
.log .when{color:var(--muted); font-size:11.5px; font-family:var(--mono)}

.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:60;
  background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:999px;
  font-size:13px; box-shadow:var(--shadow);
}
@media (prefers-reduced-motion: no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translate(-50%, 8px)} to{opacity:1; transform:translate(-50%,0)}}
}
.banner{border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); border-radius:8px; padding:10px 13px; font-size:12.5px}
.banner.info{border-color:var(--info); background:var(--info-soft); color:var(--info)}
.mailbox{font-family:var(--mono); font-size:11.5px; white-space:pre-wrap; line-height:1.55; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:6px; padding:10px 12px; max-height:280px; overflow:auto}
</style>

null,"next":null,"notes":null,"check":null,"due":null,"completion":null,"createdAt":"2026-09-16T00:00:00","weeks":{},"tags":[],"history":[],"comments":[]},{"id":"action-6ccgk7njciu","workItemId":"item-vgb1cayiix1","projectId":"project-c1qyjsebcv3","pillarId":"pillar-proficy","meetingId":null,"relatedActionId":null,"origin":"Plan","serial":"ACT-0361","name":"Update the TAG","ownerIds":["user-akxbw1v"],"status":"NotStarted","priority":"Low","quarter":"None","recurrence":"None","source":"90-Day","target":null,"success":null,"next":null,"notes":null,"check":null,"due":null,"completion":null,"createdAt":"2026-09-16T00:00:00","weeks":{},"tags":[],"history":[],"comments":[]},{"id":"action-bprors4lbzq","workItemId":"item-vgb1cayiix1","projectId":"project-c1qyjsebcv3","pillarId":"pillar-proficy","meetingId":null,"relatedActionId":null,"origin":"Plan","serial":"ACT-0362","name":"Update all size and Product Limit","ownerIds":[],"status":"NotStarted","priority":"Low","quarter":"None","recurrence":"None","source":"90-Day","target":null,"success":null,"next":null,"notes":null,"check":null,"due":null,"completion":null,"createdAt":"2026-09-16T00:00:00","weeks":{},"tags":[],"history":[],"comments":[]}],"meetings":[],"serials":{"action":385,"meeting":1}}</script>
<script>
/* ------------------------------------------------------------------ *
 * Digital Control Tower — single-file edition.
 * Same model as the ASP.NET Core / SQL Server build: pillars → projects
 * → work items → actions, a 14-week grid, meetings whose actions flow
 * into the master plan, value reporting and due-date reminders.
 * People are always referenced by their mail alias (handle).
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var SEED = JSON.parse(document.getElementById("seed-data").textContent);
  var STORE = "dct.single.v1";
  var WEEK_MARKS = ["T", "R", "A"];
  var STATUSES = ["NotStarted", "NeedsDefinition", "OnTrack", "AtRisk", "Delayed", "Complete", "Cancelled"];
  var PRIORITIES = ["Low", "Medium", "High", "Critical"];
  var QUARTERS = ["None", "Q1", "Q2", "Q3", "Q4"];
  var RECURRENCES = ["None", "Weekly", "BiWeekly", "Monthly", "Quarterly"];
  var SAVINGS = ["NotSet", "Hard", "Soft", "CostAvoidance", "Other"];
  var REMIND_DAYS = 2;

  var LABEL = {
    NotStarted: "Not Started", NeedsDefinition: "Needs Definition", OnTrack: "On Track",
    AtRisk: "At Risk", Delayed: "Delayed", Complete: "Complete", Cancelled: "Cancelled",
    Low: "Low", Medium: "Medium", High: "High", Critical: "Critical",
    None: "—", Q1: "Q1", Q2: "Q2", Q3: "Q3", Q4: "Q4",
    Weekly: "Weekly", BiWeekly: "Bi-weekly", Monthly: "Monthly", Quarterly: "Quarterly",
    NotSet: "Not captured", Hard: "Hard saving", Soft: "Soft saving",
    CostAvoidance: "Cost avoidance", Other: "Other",
    Active: "Active", OnHold: "On hold", Local: "Local", Regional: "Regional", Global: "Global",
    Plan: "90-day plan", Meeting: "Meeting"
  };
  var TONE = {
    Complete: "ok", OnTrack: "info", AtRisk: "warn", Delayed: "bad",
    NeedsDefinition: "info", Cancelled: "neutral", NotStarted: "neutral",
    Critical: "bad", High: "warn", Medium: "neutral", Low: "neutral",
    Hard: "ok", Soft: "info", CostAvoidance: "accent", Other: "neutral", NotSet: "neutral",
    Active: "info", NotStartedProject: "neutral"
  };

  /* ---- state ------------------------------------------------------ */
  var db = load();
  var ui = {
    view: "dashboard",
    meetingId: null,
    drawer: null,
    me: db.users.length ? db.users[0].id : null,
    actionFilter: { q: "", pillar: "", project: "", owner: "", status: "", priority: "", origin: "", noDue: false, noOwner: false, overdue: false, limit: 60 },
    gridFilter: { pillar: "", project: "", openOnly: true },
    valueFilter: { pillar: "", type: "", withValue: false },
    gap: "all"
  };
  try {
    var savedMe = localStorage.getItem(STORE + ".me");
    if (savedMe && db.users.some(function (u) { return u.id === savedMe; })) ui.me = savedMe;
  } catch (e) { /* storage may be blocked */ }

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) {
        var saved = JSON.parse(raw);
        if (saved && saved.actions && saved.pillars) return saved;
      }
    } catch (e) { /* fall through to the shipped data */ }
    return JSON.parse(JSON.stringify(SEED));
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { /* nothing to do */ }
  }
  function resetData() {
    db = JSON.parse(JSON.stringify(SEED));
    try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ }
    ui.view = "dashboard"; ui.drawer = null;
    render(); toast("Back to the data this file shipped with.");
  }

  /* ---- helpers ---------------------------------------------------- */
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function label(key) { return LABEL[key] || key || "—"; }
  function tone(key) { return TONE[key] || "neutral"; }
  function pill(key) { return '<span class="pill ' + tone(key) + '">' + esc(label(key)) + "</span>"; }
  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function user(id) { return byId(db.users, id); }
  function handleTag(id, plain) {
    var u = user(id);
    if (!u) return '<span class="dim">—</span>';
    return '<span class="handle' + (plain ? " plain" : "") + '" title="' + esc(u.name) + '">' + esc(u.handle) + "</span>";
  }
  function handlesOf(action) {
    if (!action.ownerIds || !action.ownerIds.length) return '<span class="dim">—</span>';
    return action.ownerIds.map(function (id) { return handleTag(id); }).join("");
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, days) {
    var d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d)) return esc(iso);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit", timeZone: "UTC" });
  }
  function fmtLong(iso) {
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d)) return esc(iso);
    return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  }
  function fmtStamp(value) {
    if (!value) return "";
    var d = new Date(value);
    if (isNaN(d)) return esc(value);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit" }) + " " +
      d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }
  function num(value, digits) {
    var n = Number(value || 0);
    return n.toLocaleString("en-GB", { minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0 });
  }
  function pct(part, whole) { return whole ? Math.round((part / whole) * 1000) / 10 : 0; }
  function isOpen(a) { return a.status !== "Complete" && a.status !== "Cancelled"; }
  function isOverdue(a) { return isOpen(a) && !!a.due && a.due < today(); }
  function meHandle() { var u = user(ui.me); return u ? u.handle : "unknown"; }

  function projectOf(a) { return a.projectId ? byId(db.projects, a.projectId) : null; }
  function pillarOf(a) { return a.pillarId ? byId(db.pillars, a.pillarId) : null; }
  function itemOf(a) { return a.workItemId ? byId(db.items, a.workItemId) : null; }
  function contextPath(a) {
    var parts = [];
    var p = pillarOf(a); if (p) parts.push(p.name);
    var pr = projectOf(a); if (pr) parts.push(pr.name);
    var it = itemOf(a); if (it) parts.push(it.name);
    return parts.join(" / ");
  }
  function projectActions(projectId) {
    return db.actions.filter(function (a) { return a.projectId === projectId; });
  }
  function hasValue(p) {
    return p.savingsType !== "NotSet" || !!p.money || !!p.hours || !!p.productivity;
  }
  function nextSerial(kind) {
    db.serials[kind] = (db.serials[kind] || 0) + 1;
    return (kind === "meeting" ? "MTG-" : "ACT-") + String(db.serials[kind]).padStart(4, "0");
  }
  function logChange(action, field, from, to) {
    if (String(from || "") === String(to || "")) return;
    action.history = action.history || [];
    action.history.push({
      id: "hist-" + Math.random().toString(36).slice(2, 12),
      field: field, from: from || null, to: to || null,
      by: meHandle(), at: new Date().toISOString()
    });
    action.updatedAt = new Date().toISOString();
  }
  function toast(message) {
    var el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("role", "status");
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }
  function selectOptions(values, selected, blank) {
    var html = blank ? '<option value="">' + esc(blank) + "</option>" : "";
    return html + values.map(function (v) {
      var value = typeof v === "string" ? v : v.value;
      var text = typeof v === "string" ? label(v) : v.text;
      return '<option value="' + esc(value) + '"' + (String(value) === String(selected) ? " selected" : "") + ">" + esc(text) + "</option>";
    }).join("");
  }
  function userOptions(selected, blank) {
    return selectOptions(db.users.slice().sort(byHandle).map(function (u) {
      return { value: u.id, text: u.handle + " — " + u.name };
    }), selected, blank);
  }
  function byHandle(a, b) { return a.handle.localeCompare(b.handle); }
  function pillarOptions(selected, blank) {
    return selectOptions(db.pillars.slice().sort(function (a, b) { return a.sort - b.sort; })
      .map(function (p) { return { value: p.id, text: p.name }; }), selected, blank);
  }
  function projectOptions(selected, blank, pillarId) {
    var list = db.projects.filter(function (p) { return !pillarId || p.pillarId === pillarId; });
    return selectOptions(list.map(function (p) {
      var pl = byId(db.pillars, p.pillarId);
      return { value: p.id, text: (pl ? pl.name + " / " : "") + p.name };
    }), selected, blank);
  }
  function itemOptions(selected, blank) {
    var list = db.items.slice().sort(function (a, b) {
      var pa = byId(db.projects, a.projectId), pb = byId(db.projects, b.projectId);
      return (pa ? pa.name : "").localeCompare(pb ? pb.name : "") || a.sort - b.sort;
    });
    return selectOptions(list.map(function (i) {
      var p = byId(db.projects, i.projectId);
      return { value: i.id, text: (p ? p.name + " / " : "") + i.name };
    }), selected, blank);
  }
  function planActionOptions(selected, blank) {
    var list = db.actions.slice().sort(function (a, b) { return a.serial.localeCompare(b.serial); });
    return selectOptions(list.map(function (a) {
      return { value: a.id, text: a.serial + " — " + (a.name.length > 60 ? a.name.slice(0, 57) + "…" : a.name) };
    }), selected, blank);
  }
  function emptyRow(cols, text) {
    return '<tr><td class="empty" colspan="' + cols + '">' + esc(text) + "</td></tr>";
  }
  function meter(part, whole) {
    var p = pct(part, whole);
    return '<div class="meter"><div class="bar"><i style="width:' + p + '%"></i></div><span class="pct">' + p + "%</span></div>";
  }

  /* ---- reminders --------------------------------------------------- */
  function reminderBatches() {
    var target = addDays(today(), REMIND_DAYS);
    var map = {};
    db.actions.forEach(function (a) {
      if (!isOpen(a) || !a.due) return;
      var due = a.due === target, late = a.due < today();
      if (!due && !late) return;
      (a.ownerIds || []).forEach(function (id) {
        var u = user(id);
        if (!u) return;
        if (!map[id]) map[id] = { user: u, due: [], late: [] };
        (due ? map[id].due : map[id].late).push(a);
      });
    });
    return Object.keys(map).map(function (id) { return map[id]; })
      .filter(function (b) { return b.due.length || b.late.length; })
      .sort(function (a, b) { return b.due.length - a.due.length || a.user.handle.localeCompare(b.user.handle); });
  }
  function reminderMail(batch) {
    var target = addDays(today(), REMIND_DAYS);
    var lines = [];
    lines.push("To: " + batch.user.email);
    lines.push("Subject: Digital Control Tower — " + batch.due.length + " action(s) due " + fmtDate(target) +
      (batch.late.length ? ", " + batch.late.length + " overdue" : ""));
    lines.push("");
    lines.push("Hello " + batch.user.name + ",");
    lines.push("");
    lines.push("These actions are due on " + fmtLong(target) + ".");
    batch.due.forEach(function (a) {
      lines.push("  " + a.serial + "  " + a.name + "  [" + label(a.status) + "]  " + (contextPath(a) || "—"));
    });
    if (batch.late.length) {
      lines.push("");
      lines.push("Still open past their due date:");
      batch.late.forEach(function (a) {
        lines.push("  " + a.serial + "  " + a.name + "  due " + a.due + "  [" + label(a.status) + "]");
      });
    }
    lines.push("");
    lines.push("Sent by the Digital Control Tower. Update the action in the tower to change or close it.");
    return lines.join("\n");
  }

  /* ---- navigation -------------------------------------------------- */
  var NAV = [
    { group: "Plan", items: [
      { id: "dashboard", glyph: "◉", label: "Dashboard" },
      { id: "actions", glyph: "☰", label: "Actions", tally: function () { return db.actions.filter(isOpen).length; } },
      { id: "weeks", glyph: "▦", label: "Week grid" }
    ]},
    { group: "Meetings action plan", items: [
      { id: "meetings", glyph: "🗓", label: "Meetings", tally: function () { return db.meetings.length; } },
      { id: "today", glyph: "＋", label: "Today's meeting" }
    ]},
    { group: "Reports", items: [
      { id: "value", glyph: "▲", label: "Value added" },
      { id: "gaps", glyph: "⚠", label: "What is missing", tally: function () { return gapCounts().total; } },
      { id: "reminders", glyph: "✉", label: "Reminders", tally: function () { return reminderBatches().reduce(function (n, b) { return n + b.due.length; }, 0); } }
    ]},
    { group: "Setup", items: [
      { id: "users", glyph: "◎", label: "Users", tally: function () { return db.users.length; } },
      { id: "data", glyph: "⤓", label: "Data" }
    ]}
  ];

  function renderRail() {
    var current = ui.view === "meeting" ? "meetings" : ui.view;
    document.getElementById("rail").innerHTML = NAV.map(function (group) {
      return '<div class="group"><div class="group-label">' + esc(group.group) + "</div>" +
        group.items.map(function (item) {
          var tally = item.tally ? '<span class="tally">' + item.tally() + "</span>" : "";
          return '<button type="button" data-act="go" data-view="' + item.id + '"' +
            (current === item.id ? ' aria-current="true"' : "") + '>' +
            '<span class="glyph" aria-hidden="true">' + item.glyph + "</span>" + esc(item.label) + tally + "</button>";
        }).join("") + "</div>";
    }).join("");
  }

  /* ---- dashboard --------------------------------------------------- */
  function viewDashboard() {
    var actions = db.actions;
    var open = actions.filter(isOpen).length;
    var complete = actions.filter(function (a) { return a.status === "Complete"; }).length;
    var overdue = actions.filter(isOverdue).length;
    var activeProjects = db.projects.filter(function (p) { return p.status === "Active"; }).length;
    var meeting = db.meetings.filter(function (m) { return m.date === today(); })[0];
    var last = db.meetings.filter(function (m) { return m.date < today(); })
      .sort(function (a, b) { return b.date.localeCompare(a.date); })[0];
    var meetingOpen = actions.filter(function (a) { return a.origin === "Meeting" && isOpen(a); }).length;
    var money = db.projects.reduce(function (n, p) { return n + (p.money || 0); }, 0);
    var hours = db.projects.reduce(function (n, p) { return n + (p.hours || 0); }, 0);
    var noValue = db.projects.filter(function (p) { return !hasValue(p); }).length;
    var batches = reminderBatches();
    var dueSoon = batches.reduce(function (n, b) { return n + b.due.length; }, 0);
    var noDue = actions.filter(function (a) { return isOpen(a) && !a.due; }).length;

    var statusMix = STATUSES.map(function (s) {
      return { status: s, count: actions.filter(function (a) { return a.status === s; }).length };
    }).filter(function (row) { return row.count; });

    var pillars = db.pillars.slice().sort(function (a, b) { return a.sort - b.sort; }).map(function (p) {
      var list = actions.filter(function (a) { return a.pillarId === p.id; });
      return {
        pillar: p,
        projects: db.projects.filter(function (pr) { return pr.pillarId === p.id; }).length,
        actions: list.length,
        complete: list.filter(function (a) { return a.status === "Complete"; }).length,
        risk: list.filter(function (a) { return a.status === "AtRisk" || a.status === "Delayed"; }).length
      };
    });

    var load = {};
    actions.forEach(function (a) {
      (a.ownerIds || []).forEach(function (id) {
        if (!load[id]) load[id] = { id: id, open: 0, complete: 0 };
        if (a.status === "Complete") load[id].complete++; else if (isOpen(a)) load[id].open++;
      });
    });
    var owners = Object.keys(load).map(function (k) { return load[k]; })
      .sort(function (a, b) { return b.open - a.open; }).slice(0, 8);

    var attention = actions.filter(function (a) {
      return isOpen(a) && (a.status === "AtRisk" || a.status === "Delayed" || isOverdue(a));
    }).sort(function (a, b) { return (a.due || "9999").localeCompare(b.due || "9999"); }).slice(0, 12);

    var recent = [];
    actions.forEach(function (a) {
      (a.history || []).forEach(function (h) { recent.push({ action: a, entry: h }); });
    });
    recent.sort(function (a, b) { return String(b.entry.at).localeCompare(String(a.entry.at)); });
    recent = recent.slice(0, 8);

    return '' +
      '<div class="page-head"><div class="lead"><h1>Control tower</h1>' +
      '<div class="hint">' + esc(fmtLong(today())) + ' &middot; tracking weeks ' +
      esc(fmtDate(db.weekDates[0])) + ' to ' + esc(fmtDate(db.weekDates[db.weekDates.length - 1])) + '</div></div>' +
      '<button class="btn primary" data-act="go" data-view="today">Open today\'s meeting</button></div>' +

      '<div class="readouts">' +
        readout("Actions", actions.length, db.actions.filter(function (a) { return a.origin === "Meeting"; }).length + " from meetings") +
        readout("Open", open, "") +
        readout("Complete", complete, pct(complete, actions.length) + "% of all", "good") +
        readout("Overdue", overdue, overdue ? "past their due date" : "nothing late", overdue ? "alert" : "") +
        readout("Projects", db.projects.length, activeProjects + " active") +
        readout("Value / year", num(money), num(hours) + " hours saved") +
      '</div>' +

      '<div class="row" style="margin-top:14px">' +
        '<section class="panel col-wide">' +
          '<div class="panel-head"><h2>Digital team meeting</h2>' +
          '<button class="btn primary small" data-act="go" data-view="today">' +
          (meeting ? "Open today's meeting" : "Start today's meeting") + '</button></div>' +
          '<div class="panel-body">' +
            (meeting
              ? '<p><span class="serial">' + esc(meeting.serial) + '</span> <strong>' + esc(meeting.title) + '</strong> ' +
                '<span class="hint">' + esc(fmtLong(meeting.date)) + '</span></p>' +
                '<p class="hint">Participants: ' + (meeting.participantIds.length
                  ? meeting.participantIds.map(function (id) { return handleTag(id); }).join("")
                  : "none picked yet") + '</p>'
              : '<p>No meeting opened for today yet. Opening one creates it on today\'s date — then add participants, ' +
                'write the minutes and raise actions that flow straight into the plan.</p>') +
            '<p class="hint" style="margin:0">' + meetingOpen + ' open action(s) raised in meetings' +
            (last ? ' &middot; last meeting ' + esc(fmtDate(last.date)) : "") + '</p>' +
          '</div>' +
        '</section>' +

        '<section class="panel col">' +
          '<div class="panel-head"><h2>Reminders</h2></div>' +
          '<div class="panel-body">' +
            '<div class="readout" style="padding:0"><div class="v">' + dueSoon + '</div>' +
            '<div class="s">action(s) due ' + esc(fmtDate(addDays(today(), REMIND_DAYS))) +
            ' — owners are mailed two days ahead.</div></div>' +
            '<p class="hint" style="margin:10px 0 0"><a href="#" data-act="go" data-view="reminders">Reminder queue</a>' +
            (noDue ? ' &middot; <a href="#" data-act="gap" data-gap="noDue">' + noDue + ' open action(s) with no due date</a>' : "") +
            '</p>' +
          '</div>' +
        '</section>' +

        '<section class="panel col">' +
          '<div class="panel-head"><h2>Value added</h2></div>' +
          '<div class="panel-body">' +
            '<div class="kv" style="grid-template-columns:1fr auto; margin-bottom:8px">' +
              '<dt>Financial value / year</dt><dd class="num">' + num(money) + '</dd>' +
              '<dt>Labour hours saved</dt><dd class="num">' + num(hours) + '</dd>' +
              '<dt>Projects with value</dt><dd class="num">' + (db.projects.length - noValue) + "/" + db.projects.length + '</dd>' +
            '</div>' +
            '<p class="hint" style="margin:0"><a href="#" data-act="go" data-view="value">Full value report</a>' +
            (noValue ? ' &middot; <a href="#" data-act="gap" data-gap="noValue">' + noValue + ' with nothing captured</a>' : "") +
            '</p>' +
          '</div>' +
        '</section>' +
      '</div>' +

      '<div class="row" style="margin-top:14px">' +
        '<section class="panel col-wide">' +
          '<div class="panel-head"><h2>Pillars</h2><span class="hint">progress by completed actions</span></div>' +
          '<div class="scroll"><table><thead><tr><th>Pillar</th><th class="num">Projects</th><th class="num">Actions</th>' +
          '<th class="num">At risk</th><th style="width:34%">Progress</th></tr></thead><tbody>' +
          pillars.map(function (row) {
            return '<tr class="clickable" data-act="pillar" data-id="' + esc(row.pillar.id) + '">' +
              '<td class="stripe ' + (row.risk ? "warn" : "neutral") + '">' + esc(row.pillar.name) + "</td>" +
              '<td class="num">' + row.projects + "</td><td class=\"num\">" + row.actions + "</td>" +
              '<td class="num">' + (row.risk ? '<span class="pill bad">' + row.risk + "</span>" : '<span class="dim">0</span>') + "</td>" +
              "<td>" + meter(row.complete, row.actions) + "</td></tr>";
          }).join("") +
          '</tbody></table></div>' +
        '</section>' +

        '<section class="panel col">' +
          '<div class="panel-head"><h2>Status mix</h2></div>' +
          '<div class="panel-body">' +
          statusMix.map(function (row) {
            var share = pct(row.count, actions.length);
            return '<div style="margin-bottom:9px">' +
              '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:3px">' +
              pill(row.status) + '<span class="mono dim" style="font-size:11.5px">' + row.count + " · " + share + "%</span></div>" +
              '<div class="bar"><i style="width:' + share + "%; background:var(--" + tone(row.status) + ')"></i></div></div>';
          }).join("") +
          '</div>' +
        '</section>' +
      '</div>' +

      '<div class="row" style="margin-top:14px">' +
        '<section class="panel col-wide">' +
          '<div class="panel-head"><h2>Needs attention</h2><span class="hint">at risk, delayed or past the due date</span></div>' +
          '<div class="scroll"><table><thead><tr><th>Serial</th><th>Action</th><th>Owners</th><th>Due</th><th>Status</th></tr></thead><tbody>' +
          (attention.length ? attention.map(actionRow).join("") : emptyRow(5, "Nothing at risk or overdue.")) +
          '</tbody></table></div>' +
        '</section>' +

        '<section class="panel col">' +
          '<div class="panel-head"><h2>Load per handle</h2></div>' +
          '<div class="scroll"><table><thead><tr><th>Handle</th><th class="num">Open</th><th class="num">Done</th></tr></thead><tbody>' +
          (owners.length ? owners.map(function (row) {
            return '<tr class="clickable" data-act="owner" data-id="' + esc(row.id) + '"><td>' + handleTag(row.id) + "</td>" +
              '<td class="num">' + row.open + '</td><td class="num dim">' + row.complete + "</td></tr>";
          }).join("") : emptyRow(3, "No owners yet.")) +
          '</tbody></table></div>' +
          '<div class="panel-head" style="border-top:1px solid var(--line-soft); border-bottom:0"><h2>Recent changes</h2></div>' +
          '<div class="panel-body" style="padding-top:0"><ul class="log">' +
          (recent.length ? recent.map(function (row) {
            return "<li><a href=\"#\" data-act=\"open\" data-id=\"" + esc(row.action.id) + '">' + esc(row.action.serial) + "</a> " +
              '<span class="dim">' + esc(row.entry.field) + "</span> " + esc(row.entry.from || "—") + " → <strong>" + esc(row.entry.to || "—") + "</strong>" +
              '<div class="when">' + esc(row.entry.by) + " · " + esc(fmtStamp(row.entry.at)) + "</div></li>";
          }).join("") : "<li class=\"dim\">No changes recorded yet.</li>") +
          '</ul></div>' +
        '</section>' +
      '</div>';
  }

  function readout(k, v, s, cls) {
    return '<div class="readout ' + (cls || "") + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + esc(String(v)) + "</div>" + (s ? '<div class="s">' + esc(s) + "</div>" : "") + "</div>";
  }
  function actionRow(a) {
    return '<tr class="clickable" data-act="open" data-id="' + esc(a.id) + '">' +
      '<td class="stripe ' + tone(a.status) + ' serial">' + esc(a.serial) + "</td>" +
      "<td>" + esc(a.name) + (a.origin === "Meeting" ? ' <span class="pill accent">meeting</span>' : "") +
      '<div class="hint">' + esc(contextPath(a) || "—") + "</div></td>" +
      "<td>" + handlesOf(a) + "</td>" +
      '<td class="serial' + (isOverdue(a) ? ' pill bad' : "") + '">' + esc(fmtDate(a.due)) + "</td>" +
      "<td>" + pill(a.status) + "</td></tr>";
  }

  /* ---- meetings ---------------------------------------------------- */
  function viewMeetings() {
    var rows = db.meetings.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    return '' +
      '<div class="page-head"><div class="lead"><h1>Meetings action plan</h1>' +
      '<div class="hint">Every digital team meeting, who was there, the minutes, and the actions it raised. ' +
      'Those actions sit in the master plan too.</div></div>' +
      '<button class="btn primary" data-act="go" data-view="today">Open today\'s meeting</button></div>' +
      '<section class="panel"><div class="scroll"><table><thead><tr>' +
      '<th>Serial</th><th>Date</th><th>Title</th><th>Chair</th><th>Participants</th><th class="num">Actions</th><th class="num">Open</th>' +
      '</tr></thead><tbody>' +
      (rows.length ? rows.map(function (m) {
        var list = db.actions.filter(function (a) { return a.meetingId === m.id; });
        return '<tr class="clickable" data-act="meeting" data-id="' + esc(m.id) + '">' +
          '<td class="stripe ' + (m.date === today() ? "info" : "neutral") + ' serial">' + esc(m.serial) + "</td>" +
          '<td class="serial">' + esc(fmtDate(m.date)) + (m.date === today() ? ' <span class="pill info">today</span>' : "") + "</td>" +
          "<td>" + esc(m.title) + "</td><td>" + (m.chairId ? handleTag(m.chairId) : '<span class="dim">—</span>') + "</td>" +
          "<td>" + (m.participantIds.length ? m.participantIds.map(function (id) { return handleTag(id); }).join("") : '<span class="dim">—</span>') + "</td>" +
          '<td class="num">' + list.length + '</td><td class="num">' + list.filter(isOpen).length + "</td></tr>";
      }).join("") : emptyRow(7, "No meetings yet — open today's to start one.")) +
      "</tbody></table></div></section>";
  }

  function openToday() {
    var existing = db.meetings.filter(function (m) { return m.date === today(); })[0];
    if (existing) { ui.view = "meeting"; ui.meetingId = existing.id; return; }
    openDate(today());
  }
  function openDate(date) {
    var existing = db.meetings.filter(function (m) { return m.date === date; })[0];
    if (!existing) {
      existing = {
        id: "meeting-" + Math.random().toString(36).slice(2, 12),
        serial: nextSerial("meeting"),
        date: date,
        title: "Digital team meeting",
        minutes: "",
        chairId: ui.me,
        participantIds: ui.me ? [ui.me] : []
      };
      db.meetings.push(existing);
      save();
    }
    ui.view = "meeting";
    ui.meetingId = existing.id;
  }

  function viewMeeting() {
    var m = byId(db.meetings, ui.meetingId);
    if (!m) { ui.view = "meetings"; return viewMeetings(); }
    var list = db.actions.filter(function (a) { return a.meetingId === m.id; })
      .sort(function (a, b) { return a.serial.localeCompare(b.serial); });
    var people = db.users.slice().sort(byHandle);

    return '' +
      '<div class="page-head"><div class="lead">' +
      '<h1>' + esc(m.title) + '</h1>' +
      '<div class="hint"><span class="serial">' + esc(m.serial) + "</span> &middot; " + esc(fmtLong(m.date)) +
      (m.date === today() ? ' &middot; <span class="pill info">today</span>' : "") +
      " &middot; " + list.length + " action(s), " + list.filter(isOpen).length + " open</div></div>" +
      '<button class="btn" data-act="go" data-view="meetings">All meetings</button>' +
      '<button class="btn danger" data-act="delete-meeting" data-id="' + esc(m.id) + '">Delete</button></div>' +

      '<div class="row">' +
        '<section class="panel col">' +
          '<div class="panel-head"><h2>Meeting</h2></div>' +
          '<form class="panel-body" data-form="save-meeting" data-id="' + esc(m.id) + '">' +
            '<label class="field"><span>Title</span><input type="text" name="title" value="' + esc(m.title) + '"></label>' +
            '<label class="field"><span>Date</span><input type="date" name="date" value="' + esc(m.date) + '"></label>' +
            '<label class="field"><span>Chaired by</span><select name="chairId">' + userOptions(m.chairId, "— not set —") + "</select></label>" +
            '<div class="field"><span>Participants</span><div class="chips">' +
            people.map(function (u) {
              var on = m.participantIds.indexOf(u.id) >= 0;
              return '<label class="check"><input type="checkbox" name="participants" value="' + esc(u.id) + '"' +
                (on ? " checked" : "") + "> " + '<span class="handle" title="' + esc(u.name) + '">' + esc(u.handle) + "</span></label>";
            }).join("") + "</div></div>" +
            '<label class="field" style="margin-top:10px"><span>Minutes</span>' +
            '<textarea name="minutes" rows="9" placeholder="Decisions, discussion, follow-ups…">' + esc(m.minutes || "") + "</textarea></label>" +
            '<button class="btn primary" type="submit">Save meeting</button>' +
          "</form>" +
          '<div class="panel-body" style="border-top:1px solid var(--line-soft)">' +
            '<form data-form="open-date" class="filters">' +
              '<label class="field grow"><span>Open another date</span><input type="date" name="date" value="' + esc(today()) + '"></label>' +
              '<button class="btn" type="submit">Open</button>' +
            "</form>" +
            '<p class="hint" style="margin:6px 0 0">A meeting is created for that date if there is not one yet.</p>' +
          "</div>" +
        "</section>" +

        '<section class="panel col-wide">' +
          '<div class="panel-head"><h2>Add an action</h2><span class="hint">starts as Not Started</span></div>' +
          '<form class="panel-body" data-form="add-action" data-id="' + esc(m.id) + '">' +
            '<label class="field"><span>Action</span><input type="text" name="name" required placeholder="What was agreed?"></label>' +
            '<div class="filters">' +
              '<label class="field grow"><span>Owners</span><select name="owners" multiple size="4">' + userOptions("", null) + "</select></label>" +
              '<label class="field"><span>Due date</span><input type="date" name="due"></label>' +
              '<label class="field"><span>Priority</span><select name="priority">' + selectOptions(PRIORITIES, "Medium") + "</select></label>" +
            "</div>" +
            '<div class="filters" style="margin-top:8px">' +
              '<label class="field"><span>Relates to</span><select name="linkType" data-act="link-type">' +
                '<option value="">Nothing yet</option><option value="pillar">A pillar</option>' +
                '<option value="project">A project</option><option value="item">A 90-day work item</option>' +
                '<option value="action">Another action</option></select></label>' +
              '<label class="field grow" data-link="pillar" hidden><span>Pillar</span><select name="pillarId">' + pillarOptions("", "— choose —") + "</select></label>" +
              '<label class="field grow" data-link="project" hidden><span>Project</span><select name="projectId">' + projectOptions("", "— choose —") + "</select></label>" +
              '<label class="field grow" data-link="item" hidden><span>Work item</span><select name="itemId">' + itemOptions("", "— choose —") + "</select></label>" +
              '<label class="field grow" data-link="action" hidden><span>Action</span><select name="relatedId">' + planActionOptions("", "— choose —") + "</select></label>" +
            "</div>" +
            '<label class="field"><span>Notes</span><textarea name="notes" rows="2"></textarea></label>' +
            '<button class="btn primary" type="submit">Add action</button>' +
            '<span class="hint" style="margin-left:10px">It appears in the plan, the week grid and the reminders straight away.</span>' +
          "</form>" +
          '<div class="panel-head" style="border-top:1px solid var(--line-soft)"><h2>Actions from this meeting</h2></div>' +
          '<div class="scroll"><table><thead><tr><th>Serial</th><th>Action</th><th>Owners</th><th>Due</th><th>Relates to</th><th>Status</th></tr></thead><tbody>' +
          (list.length ? list.map(function (a) {
            var related = a.relatedActionId ? byId(db.actions, a.relatedActionId) : null;
            return '<tr class="clickable" data-act="open" data-id="' + esc(a.id) + '">' +
              '<td class="stripe ' + tone(a.status) + ' serial">' + esc(a.serial) + "</td>" +
              "<td>" + esc(a.name) + "</td><td>" + handlesOf(a) + "</td>" +
              '<td class="serial' + (isOverdue(a) ? " pill bad" : "") + '">' + esc(fmtDate(a.due)) + "</td>" +
              '<td class="hint">' + esc(related ? related.serial : (contextPath(a) || "—")) + "</td>" +
              "<td>" + pill(a.status) + "</td></tr>";
          }).join("") : emptyRow(6, "Nothing raised yet.")) +
          "</tbody></table></div>" +
        "</section>" +
      "</div>";
  }

  /* ---- actions ----------------------------------------------------- */
  function filteredActions() {
    var f = ui.actionFilter, q = f.q.trim().toLowerCase();
    return db.actions.filter(function (a) {
      if (f.pillar && a.pillarId !== f.pillar) return false;
      if (f.project && a.projectId !== f.project) return false;
      if (f.status && a.status !== f.status) return false;
      if (f.priority && a.priority !== f.priority) return false;
      if (f.origin && a.origin !== f.origin) return false;
      if (f.owner && (a.ownerIds || []).indexOf(f.owner) < 0) return false;
      if (f.noDue && a.due) return false;
      if (f.noOwner && (a.ownerIds || []).length) return false;
      if (f.overdue && !isOverdue(a)) return false;
      if (q) {
        var owners = (a.ownerIds || []).map(function (id) { var u = user(id); return u ? u.handle + " " + u.name : ""; }).join(" ");
        var hay = (a.serial + " " + a.name + " " + (a.notes || "") + " " + owners + " " + contextPath(a)).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) { return a.serial.localeCompare(b.serial); });
  }

  function viewActions() {
    var f = ui.actionFilter;
    var rows = filteredActions();
    var shown = rows.slice(0, f.limit);
    var owners = db.users.slice().sort(byHandle).filter(function (u) {
      return db.actions.some(function (a) { return (a.ownerIds || []).indexOf(u.id) >= 0; });
    });

    return '' +
      '<div class="page-head"><div class="lead"><h1>Actions</h1>' +
      '<div class="hint">' + rows.length + ' of ' + db.actions.length + ' — the 90-day plan and everything raised in meetings.</div></div></div>' +

      '<section class="panel" style="margin-bottom:14px"><div class="panel-body">' +
        '<form class="filters" data-form="action-filter">' +
          '<label class="field grow"><span>Search</span><input type="text" name="q" value="' + esc(f.q) + '" placeholder="serial, action, handle, notes"></label>' +
          '<label class="field"><span>Pillar</span><select name="pillar">' + pillarOptions(f.pillar, "All pillars") + "</select></label>" +
          '<label class="field"><span>Project</span><select name="project">' + projectOptions(f.project, "All projects", f.pillar) + "</select></label>" +
          '<label class="field"><span>Owner</span><select name="owner">' +
            selectOptions(owners.map(function (u) { return { value: u.id, text: u.handle }; }), f.owner, "All handles") + "</select></label>" +
          '<label class="field"><span>Status</span><select name="status">' + selectOptions(STATUSES, f.status, "Any") + "</select></label>" +
          '<label class="field"><span>Priority</span><select name="priority">' + selectOptions(PRIORITIES, f.priority, "Any") + "</select></label>" +
          '<label class="field"><span>Origin</span><select name="origin">' +
            selectOptions([{ value: "Plan", text: "90-day plan" }, { value: "Meeting", text: "Meeting" }], f.origin, "Any") + "</select></label>" +
          '<button class="btn primary" type="submit">Apply</button>' +
          '<button class="btn" type="button" data-act="clear-filter">Clear</button>' +
        "</form>" +
        '<div class="chips" style="margin-top:10px">' +
          '<button class="btn small" type="button" data-act="toggle-filter" data-key="noDue" aria-pressed="' + f.noDue + '">No due date</button>' +
          '<button class="btn small" type="button" data-act="toggle-filter" data-key="noOwner" aria-pressed="' + f.noOwner + '">No owner</button>' +
          '<button class="btn small" type="button" data-act="toggle-filter" data-key="overdue" aria-pressed="' + f.overdue + '">Overdue</button>' +
        "</div>" +
      "</div></section>" +

      '<section class="panel"><div class="scroll"><table><thead><tr>' +
      '<th>Serial</th><th>Action</th><th>Owners</th><th>Qtr</th><th>Priority</th><th>Due</th><th>Status</th>' +
      '</tr></thead><tbody>' +
      (shown.length ? shown.map(function (a) {
        return '<tr class="clickable" data-act="open" data-id="' + esc(a.id) + '">' +
          '<td class="stripe ' + tone(a.status) + ' serial">' + esc(a.serial) + "</td>" +
          "<td>" + esc(a.name) + (a.origin === "Meeting" ? ' <span class="pill accent">meeting</span>' : "") +
          '<div class="hint">' + esc(contextPath(a) || "—") + "</div></td>" +
          "<td>" + handlesOf(a) + "</td>" +
          '<td class="serial dim">' + (a.quarter === "None" ? "—" : esc(a.quarter)) + "</td>" +
          "<td>" + pill(a.priority) + "</td>" +
          '<td class="serial' + (isOverdue(a) ? " pill bad" : "") + '">' + esc(fmtDate(a.due)) + "</td>" +
          "<td>" + pill(a.status) + "</td></tr>";
      }).join("") : emptyRow(7, "No actions match these filters.")) +
      "</tbody></table></div>" +
      (rows.length > shown.length
        ? '<div class="panel-body" style="border-top:1px solid var(--line-soft); text-align:center">' +
          '<button class="btn" data-act="more">Show ' + Math.min(60, rows.length - shown.length) + " more of " + (rows.length - shown.length) + "</button></div>"
        : "") +
      "</section>";
  }

  /* ---- week grid --------------------------------------------------- */
  function viewWeeks() {
    var f = ui.gridFilter;
    var list = db.actions.filter(function (a) {
      if (f.pillar && a.pillarId !== f.pillar) return false;
      if (f.project && a.projectId !== f.project) return false;
      if (f.openOnly && !isOpen(a)) return false;
      return true;
    }).sort(function (a, b) { return a.serial.localeCompare(b.serial); });
    var shown = list.slice(0, 120);
    var weeks = db.weekDates;

    return '' +
      '<div class="page-head"><div class="lead"><h1>14-week tracking grid</h1>' +
      '<div class="hint">Click a cell to cycle it: blank → <b>T</b> target → <b>R</b> revised → <b>A</b> actual → blank.</div></div></div>' +

      '<section class="panel" style="margin-bottom:14px"><div class="panel-body">' +
        '<form class="filters" data-form="grid-filter">' +
          '<label class="field"><span>Pillar</span><select name="pillar">' + pillarOptions(f.pillar, "All pillars") + "</select></label>" +
          '<label class="field grow"><span>Project</span><select name="project">' + projectOptions(f.project, "All projects", f.pillar) + "</select></label>" +
          '<label class="check" style="margin-bottom:8px"><input type="checkbox" name="openOnly"' + (f.openOnly ? " checked" : "") + "> Open actions only</label>" +
          '<button class="btn primary" type="submit">Apply</button>' +
        "</form>" +
      "</div></section>" +

      (list.length > shown.length
        ? '<div class="banner" style="margin-bottom:14px">Showing the first ' + shown.length + " of " + list.length +
          " actions. Filter by pillar or project to see the rest.</div>"
        : "") +

      '<section class="panel"><div class="grid-wrap"><table class="weeks"><thead><tr>' +
      '<th style="min-width:86px">Serial</th><th style="min-width:280px">Action</th><th style="min-width:120px">Owners</th><th style="min-width:104px">Status</th>' +
      weeks.map(function (w, i) {
        var now = w <= today() && today() < addDays(w, 7);
        return '<th class="wk' + (now ? " now" : "") + '"><b>W' + (i + 1) + "</b>" + esc(fmtDate(w).slice(0, 6)) + "</th>";
      }).join("") +
      '</tr></thead><tbody>' +
      (shown.length ? shown.map(function (a) {
        return "<tr>" +
          '<td class="stripe ' + tone(a.status) + ' serial"><a href="#" data-act="open" data-id="' + esc(a.id) + '">' + esc(a.serial) + "</a></td>" +
          "<td>" + esc(a.name) + '<div class="hint">' + esc(contextPath(a) || "—") + "</div></td>" +
          "<td>" + handlesOf(a) + "</td><td>" + pill(a.status) + "</td>" +
          weeks.map(function (w, i) {
            var mark = (a.weeks || {})[String(i)] || "";
            return '<td class="cell"><button class="cellbtn ' + esc(mark) + '" type="button" data-act="cell" data-id="' +
              esc(a.id) + '" data-week="' + i + '" aria-label="Week ' + (i + 1) + '">' + (mark || "·") + "</button></td>";
          }).join("") +
          "</tr>";
      }).join("") : emptyRow(4 + weeks.length, "No actions match this filter.")) +
      "</tbody></table></div></section>" +
      '<div class="legend"><span><b>T</b> target</span><span><b>R</b> revised</span><span><b>A</b> actual</span>' +
      '<span>Highlighted column is the current week.</span></div>';
  }

  /* ---- value report ------------------------------------------------ */
  function viewValue() {
    var f = ui.valueFilter;
    var projects = db.projects.filter(function (p) {
      if (f.pillar && p.pillarId !== f.pillar) return false;
      if (f.type && p.savingsType !== f.type) return false;
      if (f.withValue && !hasValue(p)) return false;
      return true;
    });
    var money = projects.reduce(function (n, p) { return n + (p.money || 0); }, 0);
    var hours = projects.reduce(function (n, p) { return n + (p.hours || 0); }, 0);
    var improving = projects.filter(function (p) { return p.productivity; });
    var avg = improving.length ? improving.reduce(function (n, p) { return n + p.productivity; }, 0) / improving.length : 0;
    var withValue = projects.filter(hasValue).length;

    function slice(keyFn) {
      var map = {};
      projects.forEach(function (p) {
        var key = keyFn(p);
        if (!map[key]) map[key] = { label: key, money: 0, hours: 0, count: 0 };
        map[key].money += p.money || 0; map[key].hours += p.hours || 0; map[key].count++;
      });
      return Object.keys(map).map(function (k) { return map[k]; })
        .sort(function (a, b) { return b.money - a.money || b.count - a.count; });
    }
    var byType = slice(function (p) { return label(p.savingsType); });
    var byPillar = slice(function (p) { var pl = byId(db.pillars, p.pillarId); return pl ? pl.name : "—"; });
    var byOwner = slice(function (p) {
      var u = user(p.ownerId) || user(p.pmId);
      return u ? u.handle : "unassigned";
    });

    function sliceTable(title, rows, isHandle) {
      return '<section class="panel col"><div class="panel-head"><h2>' + esc(title) + "</h2></div>" +
        '<div class="scroll"><table><thead><tr><th>' + (isHandle ? "Handle" : "Group") +
        '</th><th class="num">Projects</th><th class="num">Value</th><th class="num">Hours</th><th style="width:24%"></th></tr></thead><tbody>' +
        (rows.length ? rows.map(function (r) {
          return "<tr><td>" + (isHandle ? '<span class="handle">' + esc(r.label) + "</span>" : esc(r.label)) + "</td>" +
            '<td class="num">' + r.count + '</td><td class="num">' + num(r.money) + '</td><td class="num">' + num(r.hours) + "</td>" +
            '<td><div class="bar accent"><i style="width:' + pct(r.money, money) + '%"></i></div></td></tr>';
        }).join("") : emptyRow(5, "Nothing captured yet.")) +
        "</tbody></table></div></section>";
    }

    return '' +
      '<div class="page-head"><div class="lead"><h1>Value added to the business</h1>' +
      '<div class="hint">What the digital department delivered — hard and soft saving, by pillar and by owner. ' +
      'Click a project to record or change its value.</div></div></div>' +

      '<section class="panel" style="margin-bottom:14px"><div class="panel-body">' +
        '<form class="filters" data-form="value-filter">' +
          '<label class="field"><span>Pillar</span><select name="pillar">' + pillarOptions(f.pillar, "All pillars") + "</select></label>" +
          '<label class="field"><span>Value type</span><select name="type">' + selectOptions(SAVINGS, f.type, "All types") + "</select></label>" +
          '<label class="check" style="margin-bottom:8px"><input type="checkbox" name="withValue"' + (f.withValue ? " checked" : "") + "> Only projects with value captured</label>" +
          '<button class="btn primary" type="submit">Apply</button>' +
        "</form>" +
      "</div></section>" +

      '<div class="readouts">' +
        readout("Financial value / year", num(money), "across " + projects.length + " project(s)") +
        readout("Labour hours saved", num(hours), "") +
        readout("Avg productivity gain", num(avg, 1) + "%", improving.length + " project(s) measured") +
        readout("Value captured", withValue + "/" + projects.length,
          (projects.length - withValue) + " with nothing recorded", projects.length - withValue ? "alert" : "good") +
      "</div>" +

      '<div class="row" style="margin-top:14px">' + sliceTable("By value type", byType) +
        sliceTable("By pillar", byPillar) + sliceTable("By owner", byOwner, true) + "</div>" +

      '<section class="panel" style="margin-top:14px"><div class="panel-head"><h2>Projects</h2>' +
      '<span class="hint">rows without a value are highlighted</span></div>' +
      '<div class="scroll"><table><thead><tr><th>Project</th><th>Pillar</th><th>Owner</th><th>Type</th>' +
      '<th class="num">Value / year</th><th class="num">Hours</th><th class="num">Productivity</th><th>Status</th></tr></thead><tbody>' +
      (projects.length ? projects.slice().sort(function (a, b) { return (b.money || 0) - (a.money || 0); }).map(function (p) {
        var pl = byId(db.pillars, p.pillarId);
        var owner = p.ownerId || p.pmId;
        return '<tr class="clickable" data-act="project" data-id="' + esc(p.id) + '">' +
          '<td class="stripe ' + (hasValue(p) ? "ok" : "warn") + '">' + esc(p.name) + "</td>" +
          '<td class="hint">' + esc(pl ? pl.name : "—") + "</td>" +
          "<td>" + (owner ? handleTag(owner) : '<span class="dim">—</span>') + "</td>" +
          "<td>" + pill(p.savingsType) + "</td>" +
          '<td class="num">' + (p.money ? num(p.money) : "—") + "</td>" +
          '<td class="num">' + (p.hours ? num(p.hours) : "—") + "</td>" +
          '<td class="num">' + (p.productivity ? num(p.productivity, 1) + "%" : "—") + "</td>" +
          "<td>" + pill(p.status) + "</td></tr>";
      }).join("") : emptyRow(8, "No projects match this filter.")) +
      "</tbody></table></div></section>";
  }

  /* ---- gaps -------------------------------------------------------- */
  function gapSets() {
    var open = db.actions.filter(isOpen);
    return {
      noDue: { title: "Actions with no due date", hint: "Nobody is reminded about these — a reminder goes out two days before a due date.", kind: "action", rows: open.filter(function (a) { return !a.due; }) },
      noOwner: { title: "Actions with no owner", hint: "An action with no handle against it cannot be chased.", kind: "action", rows: open.filter(function (a) { return !(a.ownerIds || []).length; }) },
      overdue: { title: "Overdue actions", hint: "Past their due date and still open.", kind: "action", rows: open.filter(isOverdue) },
      noValue: { title: "Projects with no value captured", hint: "No type, no money, no hours, no productivity — so they count for nothing in the value report.", kind: "project", rows: db.projects.filter(function (p) { return !hasValue(p); }) },
      noProjectOwner: { title: "Projects with no owner", hint: "Neither a digital owner nor a project manager.", kind: "project", rows: db.projects.filter(function (p) { return !p.ownerId && !p.pmId; }) },
      noItems: { title: "Projects with no work items", hint: "Nothing underneath them, so no actions can be tracked.", kind: "project", rows: db.projects.filter(function (p) { return !db.items.some(function (i) { return i.projectId === p.id; }); }) },
      emptyItems: { title: "Work items with no actions", hint: "In the plan, but with nothing to do against them.", kind: "item", rows: db.items.filter(function (i) { return !db.actions.some(function (a) { return a.workItemId === i.id; }); }) }
    };
  }
  function gapCounts() {
    var sets = gapSets(), total = 0;
    Object.keys(sets).forEach(function (k) { total += sets[k].rows.length; });
    return { sets: sets, total: total };
  }

  function viewGaps() {
    var all = gapCounts();
    var keys = Object.keys(all.sets);
    var chips = [{ key: "all", label: "Everything" }].concat(keys.map(function (k) {
      return { key: k, label: all.sets[k].title };
    }));

    function block(key) {
      var set = all.sets[key];
      var head = '<section class="panel" style="margin-bottom:14px"><div class="panel-head"><h2>' + esc(set.title) + "</h2>" +
        '<span class="pill neutral">' + set.rows.length + "</span>" +
        '<div class="hint" style="flex-basis:100%">' + esc(set.hint) + "</div></div>";

      if (!set.rows.length) return head + '<div class="empty">Nothing missing here.</div></section>';

      if (set.kind === "action") {
        return head + '<div class="scroll"><table><thead><tr><th>Serial</th><th>Action</th><th>Where</th><th>Owners</th><th>Due</th><th>Status</th></tr></thead><tbody>' +
          set.rows.slice(0, 80).map(function (a) {
            return '<tr class="clickable" data-act="open" data-id="' + esc(a.id) + '">' +
              '<td class="stripe ' + tone(a.status) + ' serial">' + esc(a.serial) + "</td><td>" + esc(a.name) + "</td>" +
              '<td class="hint">' + esc(contextPath(a) || "—") + "</td><td>" + handlesOf(a) + "</td>" +
              '<td class="serial">' + esc(fmtDate(a.due)) + "</td><td>" + pill(a.status) + "</td></tr>";
          }).join("") + "</tbody></table></div>" +
          (set.rows.length > 80 ? '<div class="panel-body hint">Showing the first 80 of ' + set.rows.length + ".</div>" : "") +
          "</section>";
      }
      if (set.kind === "project") {
        return head + '<div class="scroll"><table><thead><tr><th>Project</th><th>Pillar</th><th>Owner</th><th>PM</th><th>Status</th></tr></thead><tbody>' +
          set.rows.map(function (p) {
            var pl = byId(db.pillars, p.pillarId);
            return '<tr class="clickable" data-act="project" data-id="' + esc(p.id) + '"><td class="stripe warn">' + esc(p.name) + "</td>" +
              '<td class="hint">' + esc(pl ? pl.name : "—") + "</td>" +
              "<td>" + (p.ownerId ? handleTag(p.ownerId) : '<span class="dim">—</span>') + "</td>" +
              "<td>" + (p.pmId ? handleTag(p.pmId) : '<span class="dim">—</span>') + "</td>" +
              "<td>" + pill(p.status) + "</td></tr>";
          }).join("") + "</tbody></table></div></section>";
      }
      return head + '<div class="scroll"><table><thead><tr><th>Work item</th><th>Project</th><th>Pillar</th></tr></thead><tbody>' +
        set.rows.map(function (i) {
          var p = byId(db.projects, i.projectId), pl = p ? byId(db.pillars, p.pillarId) : null;
          return '<tr><td class="stripe warn">' + esc(i.name) + '</td><td class="hint">' + esc(p ? p.name : "—") +
            '</td><td class="hint">' + esc(pl ? pl.name : "—") + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    }

    return '' +
      '<div class="page-head"><div class="lead"><h1>What is missing</h1>' +
      '<div class="hint">' + all.total + " gap(s) in the data behind the plan.</div></div></div>" +
      '<div class="chips" style="margin-bottom:14px">' +
      chips.map(function (c) {
        var count = c.key === "all" ? all.total : all.sets[c.key].rows.length;
        return '<button class="btn small" type="button" data-act="gap" data-gap="' + esc(c.key) + '"' +
          (ui.gap === c.key ? ' aria-pressed="true"' : "") + ">" + esc(c.label) + " (" + count + ")</button>";
      }).join("") + "</div>" +
      (ui.gap === "all" ? keys.map(block).join("") : block(ui.gap));
  }

  /* ---- reminders --------------------------------------------------- */
  function viewReminders() {
    var batches = reminderBatches();
    var target = addDays(today(), REMIND_DAYS);
    var dueSoon = batches.reduce(function (n, b) { return n + b.due.length; }, 0);
    var provisional = batches.filter(function (b) { return b.user.provisional; }).length;

    return '' +
      '<div class="page-head"><div class="lead"><h1>Reminders</h1>' +
      '<div class="hint">Owners are mailed <strong>two days</strong> before an action is due — today that means actions due on ' +
      esc(fmtLong(target)) + '. Anything already overdue rides along in the same mail.</div></div></div>' +

      '<div class="banner info" style="margin-bottom:14px">This single file shows exactly what the server sends. ' +
      'Sending itself is done by the installed application, which runs the sweep daily and mails through Outlook.</div>' +

      (provisional ? '<div class="banner" style="margin-bottom:14px">' + provisional +
        ' of these people still have a guessed address from the import. Check them under Users before relying on the mails.</div>' : "") +

      '<div class="readouts" style="margin-bottom:14px">' +
        readout("Mails to send", batches.length, "one per owner") +
        readout("Actions due " + fmtDate(target), dueSoon, "") +
        readout("Overdue included", batches.reduce(function (n, b) { return n + b.late.length; }, 0), "") +
      "</div>" +

      '<div class="row">' +
        '<section class="panel col-wide"><div class="panel-head"><h2>Next run</h2></div>' +
        '<div class="scroll"><table><thead><tr><th>Handle</th><th>Email</th><th class="num">Due soon</th><th class="num">Overdue</th><th>Actions</th></tr></thead><tbody>' +
        (batches.length ? batches.map(function (b) {
          return '<tr class="clickable" data-act="mail" data-id="' + esc(b.user.id) + '"><td>' + handleTag(b.user.id) + "</td>" +
            '<td class="hint">' + esc(b.user.email) + (b.user.provisional ? ' <span class="pill warn">check</span>' : "") + "</td>" +
            '<td class="num">' + b.due.length + '</td><td class="num">' + (b.late.length || "—") + "</td>" +
            '<td class="serial hint">' + b.due.concat(b.late).slice(0, 5).map(function (a) { return esc(a.serial); }).join(" ") +
            (b.due.length + b.late.length > 5 ? " +" + (b.due.length + b.late.length - 5) : "") + "</td></tr>";
        }).join("") : emptyRow(5, "Nothing due in two days, and nothing overdue.")) +
        "</tbody></table></div></section>" +

        '<section class="panel col"><div class="panel-head"><h2>Mail preview</h2>' +
        '<span class="hint">click a row to preview</span></div>' +
        '<div class="panel-body">' +
        (batches.length
          ? '<div class="mailbox" id="mail-preview">' + esc(reminderMail(batches[0])) + "</div>" +
            '<button class="btn small" style="margin-top:10px" data-act="copy-mail">Copy this mail</button>'
          : '<p class="hint">Nothing to preview.</p>') +
        "</div></section>" +
      "</div>";
  }

  /* ---- users ------------------------------------------------------- */
  function viewUsers() {

    return '' +
      '<div class="page-head"><div class="lead"><h1>Users</h1>' +

        '<section class="panel col"><div class="panel-head"><h2>Add someone</h2></div>' +

          '<label class="field"><span>Email</span><input type="email" name="email" required placeholder="brika.wm@pg.com"></label>' +
          '<label class="field"><span>Handle</span><input type="text" name="handle" placeholder="taken from the address"></label>' +
          '<label class="field"><span>Full name</span><input type="text" name="name" required placeholder="Walaa Brika"></label>' +
          '<button class="btn primary" type="submit">Add user</button>' +

  /* ---- data -------------------------------------------------------- */
  function viewData() {
    return '' +
      '<div class="page-head"><div class="lead"><h1>Data</h1>' +
      '<div class="hint">This file keeps your changes in this browser. The installed application keeps them in SQL Server, ' +

  /* ---- drawers ----------------------------------------------------- */
  function closeDrawer() { ui.drawer = null; renderOverlay(); }

  function renderOverlay() {
    var host = document.getElementById("overlay");
    if (!ui.drawer) { host.innerHTML = ""; return; }
    var body = ui.drawer.kind === "action" ? actionDrawer(ui.drawer.id) : projectDrawer(ui.drawer.id);
    if (!body) { host.innerHTML = ""; ui.drawer = null; return; }
    host.innerHTML = '<button class="scrim" data-act="close" aria-label="Close"></button><aside class="drawer" role="dialog" aria-modal="true">' + body + "</aside>";
    var drawer = host.querySelector(".drawer");
    if (drawer) drawer.focus({ preventScroll: true });
  }

  function actionDrawer(id) {
    var a = byId(db.actions, id);
    if (!a) return null;
    var meeting = a.meetingId ? byId(db.meetings, a.meetingId) : null;
    var related = a.relatedActionId ? byId(db.actions, a.relatedActionId) : null;

    return '' +
      "<header><div><h2>" + esc(a.name) + "</h2>" +
      '<div class="hint"><span class="serial">' + esc(a.serial) + "</span> " + pill(a.status) + " " + pill(a.priority) +
      (a.origin === "Meeting" ? ' <span class="pill accent">meeting</span>' : "") + "</div></div>" +
      '<button class="btn small" data-act="close">Close</button></header>' +

      '<div class="chips" style="margin-bottom:14px">' +
      STATUSES.map(function (s) {
        return '<button class="btn small" data-act="set-status" data-id="' + esc(a.id) + '" data-status="' + s + '"' +
          (a.status === s ? ' aria-pressed="true"' : "") + ">" + esc(label(s)) + "</button>";
      }).join("") + "</div>" +

      '<dl class="kv">' +
        "<dt>Owners</dt><dd>" + handlesOf(a) + "</dd>" +
        "<dt>Where</dt><dd>" + esc(contextPath(a) || "not filed yet") + "</dd>" +
        "<dt>Origin</dt><dd>" + esc(label(a.origin)) +
          (meeting ? ' — <a href="#" data-act="meeting" data-id="' + esc(meeting.id) + '">' + esc(meeting.serial) + " (" + esc(fmtDate(meeting.date)) + ")</a>" : "") + "</dd>" +
        (related ? "<dt>Follows on from</dt><dd><a href=\"#\" data-act=\"open\" data-id=\"" + esc(related.id) + '">' + esc(related.serial) + " — " + esc(related.name) + "</a></dd>" : "") +
        "<dt>Due date</dt><dd>" + esc(fmtDate(a.due)) + (isOverdue(a) ? ' <span class="pill bad">overdue</span>' : "") + "</dd>" +
        "<dt>Completion</dt><dd>" + esc(fmtDate(a.completion)) + "</dd>" +
        "<dt>Quarter</dt><dd>" + esc(label(a.quarter)) + "</dd>" +
        "<dt>Recurrence</dt><dd>" + esc(label(a.recurrence)) + "</dd>" +
        "<dt>Source</dt><dd>" + esc(a.source || "—") + "</dd>" +
        (a.target ? "<dt>Target</dt><dd>" + esc(a.target) + "</dd>" : "") +
        (a.success ? "<dt>Success criteria</dt><dd>" + esc(a.success) + "</dd>" : "") +
        (a.next ? "<dt>Next step</dt><dd>" + esc(a.next) + "</dd>" : "") +
      "</dl>" +

      (a.notes ? '<h3 style="margin-bottom:6px">Notes</h3><div class="note" style="margin-bottom:14px">' + esc(a.notes) + "</div>" : "") +

      '<h3 style="margin-bottom:8px">Edit</h3>' +
      '<form data-form="edit-action" data-id="' + esc(a.id) + '" style="margin-bottom:16px">' +
        '<div class="filters">' +
          '<label class="field"><span>Priority</span><select name="priority">' + selectOptions(PRIORITIES, a.priority) + "</select></label>" +
          '<label class="field"><span>Quarter</span><select name="quarter">' + selectOptions(QUARTERS, a.quarter) + "</select></label>" +
          '<label class="field"><span>Due date</span><input type="date" name="due" value="' + esc(a.due || "") + '"></label>' +
        "</div>" +
        '<label class="field"><span>Owners (ctrl/cmd-click for several)</span>' +
        '<select name="owners" multiple size="5">' +
        db.users.slice().sort(byHandle).map(function (u) {
          return '<option value="' + esc(u.id) + '"' + ((a.ownerIds || []).indexOf(u.id) >= 0 ? " selected" : "") + ">" +
            esc(u.handle + " — " + u.name) + "</option>";
        }).join("") + "</select></label>" +
        '<label class="field"><span>Next step</span><input type="text" name="next" value="' + esc(a.next || "") + '"></label>' +
        '<label class="field"><span>Notes</span><textarea name="notes" rows="3">' + esc(a.notes || "") + "</textarea></label>" +
        '<button class="btn primary" type="submit">Save</button>' +
      "</form>" +

      '<h3 style="margin-bottom:8px">Week grid</h3>' +
      '<div class="grid-wrap" style="margin-bottom:14px"><table class="weeks" style="min-width:0"><thead><tr>' +
      db.weekDates.map(function (w, i) {
        var now = w <= today() && today() < addDays(w, 7);
        return '<th class="wk' + (now ? " now" : "") + '"><b>W' + (i + 1) + "</b></th>";
      }).join("") + "</tr></thead><tbody><tr>" +
      db.weekDates.map(function (w, i) {
        var mark = (a.weeks || {})[String(i)] || "";
        return '<td class="cell"><button class="cellbtn ' + esc(mark) + '" data-act="cell" data-id="' + esc(a.id) +
          '" data-week="' + i + '">' + (mark || "·") + "</button></td>";
      }).join("") + "</tr></tbody></table></div>" +

      '<h3 style="margin-bottom:8px">Comments</h3>' +
      '<form data-form="add-comment" data-id="' + esc(a.id) + '" class="filters" style="margin-bottom:10px">' +
        '<label class="field grow" style="margin:0"><input type="text" name="text" placeholder="Add a comment as ' + esc(meHandle()) + '"></label>' +
        '<button class="btn" type="submit">Post</button>' +
      "</form>" +
      '<ul class="log" style="margin-bottom:16px">' +
      ((a.comments || []).length ? a.comments.slice().reverse().map(function (c) {
        return '<li><div style="white-space:pre-wrap">' + esc(c.text) + "</div>" +
          '<div class="when">' + esc(c.author) + " · " + esc(fmtStamp(c.at)) + "</div></li>";
      }).join("") : '<li class="dim">No comments yet.</li>') + "</ul>" +

      '<h3 style="margin-bottom:8px">History</h3>' +
      '<ul class="log">' +
      ((a.history || []).length ? a.history.slice().reverse().map(function (h) {
        return "<li><strong>" + esc(h.field) + "</strong>: " + esc(h.from || "—") + " → " + esc(h.to || "—") +
          '<div class="when">' + esc(h.by) + " · " + esc(fmtStamp(h.at)) + "</div></li>";
      }).join("") : '<li class="dim">No changes recorded.</li>') + "</ul>";
  }

  function projectDrawer(id) {
    var p = byId(db.projects, id);
    if (!p) return null;
    var pillar = byId(db.pillars, p.pillarId);
    var list = projectActions(p.id);
    var done = list.filter(function (a) { return a.status === "Complete"; }).length;

    return '' +
      "<header><div><h2>" + esc(p.name) + "</h2>" +
      '<div class="hint">' + esc(pillar ? pillar.name : "—") + " " + pill(p.status) + " " + pill(p.savingsType) + "</div></div>" +
      '<button class="btn small" data-act="close">Close</button></header>' +

      '<dl class="kv">' +
        "<dt>Digital owner</dt><dd>" + (p.ownerId ? handleTag(p.ownerId) : '<span class="dim">—</span>') + "</dd>" +
        "<dt>Project manager</dt><dd>" + (p.pmId ? handleTag(p.pmId) : '<span class="dim">—</span>') + "</dd>" +
        "<dt>Department</dt><dd>" + esc(p.deptOwner || "—") + "</dd>" +
        "<dt>Scope</dt><dd>" + esc(p.scope ? label(p.scope) : "—") + "</dd>" +
        "<dt>Start / due</dt><dd>" + esc(fmtDate(p.start)) + " → " + esc(fmtDate(p.due)) + "</dd>" +
        "<dt>Actions</dt><dd>" + list.length + " (" + done + " complete)</dd>" +
      "</dl>" +
      meter(done, list.length) +

      '<h3 style="margin:16px 0 8px">Value added</h3>' +
      '<form data-form="save-value" data-id="' + esc(p.id) + '">' +
        '<label class="field"><span>Value type</span><select name="savingsType">' + selectOptions(SAVINGS, p.savingsType) + "</select></label>" +
        '<div class="filters">' +
          '<label class="field grow"><span>Financial value per year</span><input type="number" step="0.01" name="money" value="' + esc(p.money == null ? "" : p.money) + '"></label>' +
          '<label class="field grow"><span>Labour hours saved</span><input type="number" step="0.01" name="hours" value="' + esc(p.hours == null ? "" : p.hours) + '"></label>' +
          '<label class="field grow"><span>Productivity %</span><input type="number" step="0.1" name="productivity" value="' + esc(p.productivity == null ? "" : p.productivity) + '"></label>' +
        "</div>" +
        '<label class="field"><span>How the value was calculated</span>' +
        '<textarea name="valueNotes" rows="3" placeholder="e.g. 3 operators x 2 hours per shift x 3 shifts, at standard rate">' + esc(p.valueNotes || "") + "</textarea></label>" +
        '<button class="btn primary" type="submit">Save value</button>' +
      "</form>" +

      '<h3 style="margin:16px 0 8px">Actions</h3>' +
      '<ul class="log">' +
      (list.length ? list.slice(0, 25).map(function (a) {
        return '<li><a href="#" data-act="open" data-id="' + esc(a.id) + '">' + esc(a.serial) + "</a> " + esc(a.name) +
          '<div class="when">' + esc(label(a.status)) + " · due " + esc(fmtDate(a.due)) + "</div></li>";
      }).join("") : '<li class="dim">No actions yet.</li>') + "</ul>";
  }

  /* ---- mutations --------------------------------------------------- */
  function setStatus(action, status) {
    if (action.status === status) return;
    logChange(action, "status", label(action.status), label(status));
    action.status = status;
    if (status === "Complete" && !action.completion) {
      logChange(action, "completionDate", action.completion, today());
      action.completion = today();
    }
    save();
  }
  function cycleCell(action, week) {
    action.weeks = action.weeks || {};
    var key = String(week), current = action.weeks[key] || "";
    var next = current === "" ? "T" : WEEK_MARKS[WEEK_MARKS.indexOf(current) + 1] || "";
    if (next) action.weeks[key] = next; else delete action.weeks[key];
    action.updatedAt = new Date().toISOString();
    save();
  }

  /* ---- events ------------------------------------------------------ */
  document.addEventListener("click", function (event) {
    var el = event.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    if (act !== "link-type") event.preventDefault();

    if (act === "go") {
      var view = el.getAttribute("data-view");
      if (view === "today") { openToday(); } else { ui.view = view; }
      ui.drawer = null; render(); window.scrollTo({ top: 0, behavior: "instant" });
    } else if (act === "open") {
      ui.drawer = { kind: "action", id: id }; renderOverlay();
    } else if (act === "project") {
      ui.drawer = { kind: "project", id: id }; renderOverlay();
    } else if (act === "close") {
      closeDrawer();
    } else if (act === "meeting") {
      ui.view = "meeting"; ui.meetingId = id; ui.drawer = null; render();
    } else if (act === "delete-meeting") {
      var m = byId(db.meetings, id);
      if (m && window.confirm("Delete " + m.serial + "? Its actions stay in the plan.")) {
        db.actions.forEach(function (a) { if (a.meetingId === id) a.meetingId = null; });
        db.meetings = db.meetings.filter(function (x) { return x.id !== id; });
        save(); ui.view = "meetings"; render(); toast("Meeting deleted; its actions were kept.");
      }
    } else if (act === "pillar") {
      ui.actionFilter.pillar = id; ui.actionFilter.project = ""; ui.view = "actions"; render();
    } else if (act === "owner") {
      ui.actionFilter = Object.assign(ui.actionFilter, { owner: id, noDue: false, noOwner: false, overdue: false });
      ui.view = "actions"; ui.drawer = null; render();
    } else if (act === "set-status") {
      var action = byId(db.actions, id);
      if (action) { setStatus(action, el.getAttribute("data-status")); renderOverlay(); render(); }
    } else if (act === "cell") {
      var target = byId(db.actions, id);
      if (target) {
        cycleCell(target, Number(el.getAttribute("data-week")));
        render();
        if (ui.drawer) renderOverlay();
      }
    } else if (act === "toggle-filter") {
      var key = el.getAttribute("data-key");
      ui.actionFilter[key] = !ui.actionFilter[key];
      render();
    } else if (act === "clear-filter") {
      ui.actionFilter = { q: "", pillar: "", project: "", owner: "", status: "", priority: "", origin: "", noDue: false, noOwner: false, overdue: false, limit: 60 };
      render();
    } else if (act === "more") {
      ui.actionFilter.limit += 60; render();
    } else if (act === "gap") {
      var gap = el.getAttribute("data-gap");
      if (gap === "noDue" && ui.view !== "gaps" && ui.view !== "dashboard") { ui.actionFilter.noDue = true; ui.view = "actions"; }
      else { ui.gap = gap; ui.view = "gaps"; }
      render(); window.scrollTo({ top: 0, behavior: "instant" });
    } else if (act === "mail") {
      var batch = reminderBatches().filter(function (b) { return b.user.id === id; })[0];
      var box = document.getElementById("mail-preview");
      if (batch && box) box.textContent = reminderMail(batch);
    } else if (act === "copy-mail") {
      var preview = document.getElementById("mail-preview");
      if (preview) copy(preview.textContent, "Mail copied.");
    } else if (act === "copy-data") {
      copy(JSON.stringify(db, null, 2), "The whole tower is on your clipboard as JSON.");
    } else if (act === "reset") {
      if (window.confirm("Throw away every change made in this browser?")) resetData();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && ui.drawer) { closeDrawer(); }
  });

  document.addEventListener("change", function (event) {
    var select = event.target;
    if (select.id === "acting-as") {
      ui.me = select.value;
      try { localStorage.setItem(STORE + ".me", ui.me); } catch (e) { /* ignore */ }
      toast("Now acting as " + meHandle() + ".");
      return;
    }
    if (select.name === "linkType") {
      var form = select.closest("form");
      form.querySelectorAll("[data-link]").forEach(function (box) {
        box.hidden = box.getAttribute("data-link") !== select.value;
      });
    }
  });

  document.addEventListener("submit", function (event) {
    var form = event.target.closest("[data-form]");
    if (!form) return;
    event.preventDefault();
    var kind = form.getAttribute("data-form");
    var data = new FormData(form);
    var id = form.getAttribute("data-id");
    var value = function (name) { return (data.get(name) || "").toString().trim(); };
    var many = function (name) { return data.getAll(name).map(String).filter(Boolean); };

    if (kind === "action-filter") {
      ui.actionFilter = Object.assign(ui.actionFilter, {
        q: value("q"), pillar: value("pillar"), project: value("project"), owner: value("owner"),
        status: value("status"), priority: value("priority"), origin: value("origin"), limit: 60
      });
      render();
    } else if (kind === "grid-filter") {
      ui.gridFilter = { pillar: value("pillar"), project: value("project"), openOnly: data.get("openOnly") === "on" };
      render();
    } else if (kind === "value-filter") {
      ui.valueFilter = { pillar: value("pillar"), type: value("type"), withValue: data.get("withValue") === "on" };
      render();
    } else if (kind === "save-meeting") {
      var meeting = byId(db.meetings, id);
      if (meeting) {
        meeting.title = value("title") || "Digital team meeting";
        meeting.date = value("date") || meeting.date;
        meeting.minutes = value("minutes");
        meeting.chairId = value("chairId") || null;
        meeting.participantIds = many("participants");
        save(); render(); toast("Meeting saved.");
      }
    } else if (kind === "open-date") {
      openDate(value("date") || today()); render();
    } else if (kind === "add-action") {
      var host = byId(db.meetings, id);
      var name = value("name");
      if (host && name) {
        var action = {
          id: "action-" + Math.random().toString(36).slice(2, 12),
          serial: nextSerial("action"),
          name: name,
          origin: "Meeting",
          source: "Meeting",
          meetingId: host.id,
          status: "NotStarted",
          priority: value("priority") || "Medium",
          quarter: quarterOf(value("due") || host.date),
          recurrence: "None",
          ownerIds: many("owners"),
          workItemId: null, projectId: null, pillarId: null, relatedActionId: null,
          due: value("due") || null,
          completion: null,
          target: null, success: null, next: null,
          notes: value("notes") || null, check: null,
          weeks: {}, tags: [], history: [], comments: [],
          createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
        };
        var link = value("linkType");
        if (link === "item" && value("itemId")) {
          var item = byId(db.items, value("itemId"));
          if (item) {
            var parent = byId(db.projects, item.projectId);
            action.workItemId = item.id;
            action.projectId = item.projectId;
            action.pillarId = parent ? parent.pillarId : null;
          }
        } else if (link === "project" && value("projectId")) {
          var project = byId(db.projects, value("projectId"));
          if (project) { action.projectId = project.id; action.pillarId = project.pillarId; }
        } else if (link === "pillar" && value("pillarId")) {
          action.pillarId = value("pillarId");
        } else if (link === "action" && value("relatedId")) {
          var origin = byId(db.actions, value("relatedId"));
          if (origin) {
            action.relatedActionId = origin.id;
            action.workItemId = origin.workItemId;
            action.projectId = origin.projectId;
            action.pillarId = origin.pillarId;
          }
        }
        db.actions.push(action);
        save(); render();
        toast(action.serial + " added — it is in the action plan as well.");
      }
    } else if (kind === "edit-action") {
      var target = byId(db.actions, id);
      if (target) {
        var owners = many("owners");
        logChange(target, "priority", label(target.priority), label(value("priority")));
        logChange(target, "quarter", label(target.quarter), label(value("quarter")));
        logChange(target, "dueDate", target.due, value("due") || null);
        var before = (target.ownerIds || []).map(function (u) { var x = user(u); return x ? x.handle : u; }).sort().join(", ");
        var after = owners.map(function (u) { var x = user(u); return x ? x.handle : u; }).sort().join(", ");
        logChange(target, "owners", before, after);
        target.priority = value("priority");
        target.quarter = value("quarter");
        target.due = value("due") || null;
        target.ownerIds = owners;
        target.next = value("next") || null;
        target.notes = value("notes") || null;
        save(); renderOverlay(); render(); toast(target.serial + " saved.");
      }
    } else if (kind === "add-comment") {
      var commented = byId(db.actions, id);
      var text = value("text");
      if (commented && text) {
        commented.comments = commented.comments || [];
        commented.comments.push({
          id: "comment-" + Math.random().toString(36).slice(2, 12),
          author: meHandle(), text: text, at: new Date().toISOString()
        });
        save(); renderOverlay();
      }
    } else if (kind === "save-value") {
      var proj = byId(db.projects, id);
      if (proj) {
        proj.savingsType = value("savingsType");
        proj.money = value("money") === "" ? null : Number(value("money"));
        proj.hours = value("hours") === "" ? null : Number(value("hours"));
        proj.productivity = value("productivity") === "" ? null : Number(value("productivity"));
        proj.valueNotes = value("valueNotes") || null;
        save(); renderOverlay(); render(); toast("Value saved for " + proj.name + ".");
      }
    } else if (kind === "add-user") {
      var email = value("email");
      var handle = (value("handle") || email.split("@")[0]).toLowerCase();
      if (!handle) { toast("Enter an address or a handle."); return; }
      if (db.users.some(function (u) { return u.handle === handle; })) { toast("That handle is already taken."); return; }
      db.users.push({
        id: "user-" + Math.random().toString(36).slice(2, 10),
        handle: handle, name: value("name") || handle, email: email, provisional: false
      });
      save(); render(); toast(handle + " added.");
    } else if (kind === "import-data") {
      try {
        var incoming = JSON.parse(value("json"));
        if (!incoming.actions || !incoming.pillars) throw new Error("not a control tower export");
        db = incoming;
        db.meetings = db.meetings || [];
        db.serials = db.serials || { action: db.actions.length, meeting: db.meetings.length };
        save(); ui.view = "dashboard"; render(); toast("Data replaced.");
      } catch (e) {
        toast("That JSON could not be read.");
      }
    }
  });

  function quarterOf(date) {
    var month = Number((date || today()).slice(5, 7));
    return month <= 3 ? "Q1" : month <= 6 ? "Q2" : month <= 9 ? "Q3" : "Q4";
  }
  function copy(text, message) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(message); }, function () { toast("Copying was blocked here."); });
    } else {
      toast("Copying is not available in this browser.");
    }
  }

  /* ---- theme ------------------------------------------------------- */
  var themeButton = document.getElementById("theme-toggle");
  function currentTheme() {
    var set = document.documentElement.getAttribute("data-theme");
    if (set) return set;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function syncTheme() { themeButton.textContent = currentTheme() === "dark" ? "Light" : "Dark"; }
  themeButton.addEventListener("click", function () {
    document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
    syncTheme();
  });

  /* ---- render ------------------------------------------------------ */
  function render() {
    renderRail();
    var host = document.getElementById("view");
    var html;
    switch (ui.view) {
      case "meetings": html = viewMeetings(); break;
      case "meeting": html = viewMeeting(); break;
      case "actions": html = viewActions(); break;
      case "weeks": html = viewWeeks(); break;
      case "value": html = viewValue(); break;
      case "gaps": html = viewGaps(); break;
      case "reminders": html = viewReminders(); break;
      case "users": html = viewUsers(); break;
      case "data": html = viewData(); break;
      default: html = viewDashboard();
    }
    host.innerHTML = html;
    var picker = document.getElementById("acting-as");
    picker.innerHTML = userOptions(ui.me, null);
    syncTheme();
  }

  render();
})();
</script>

</body>
</html>
